buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        //classpath 'com.android.tools.build:gradle:9.1.0'
        // tbh it should be fair for me to stay at this lower version
        // in my opinion its actual bs how i'd need to reinstall the whole android studio IDE as
        //if i haven't installed it before because they decided to not make a updater for the IDE
        // future me: this is gonna cause merge conflicts and definitely update gradle/android at one point to prevent issues
        classpath "com.android.tools.build:gradle:8.3.2"
    }
}

allprojects {

    ext {
        appName = 'SPD Matt Edition'
        appPackageName = 'com.DumMatt.ShatteredPixelDungeonMattEdition'

        appVersionCode = 958 // 877 was starting
        appVersionName = 'SPDMattEdition-v1400-3.3.8'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}