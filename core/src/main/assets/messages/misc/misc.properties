challenges.no_food=On diet
challenges.no_food_desc=Food's already scarce, but you have to watch your portions as well!\n\n- Food and the horn of plenty are one third as effective at satisfying hunger\n- Other sources of satiety are unaffected
challenges.no_armor=Faith is my armor
challenges.no_armor_desc=You'll need faith in yourself, as your armor won't do much!\n\n- Base blocking power reduced for all armor except cloth\n- All armor now gains very little blocking when upgraded\n- Earthen guardian's defensive power is also significantly reduced
challenges.no_healing=Pharmacophobia
challenges.no_healing_desc=Healing potions sure are handy, unfortunately you're allergic!\n\n- Potions of healing, items that use potions of healing in their recipe, and sunfruit will poison the hero instead of healing them\n- Unstable brews cannot randomly poison or heal the hero\n- These items still work normally for other characters.
challenges.no_herbalism=Barren land
challenges.no_herbalism_desc=There seems to be no clean water left in this accursed dungeon...\n\n- Dew drops are removed\n- Plants are removed\n- Seeds still appear, but will not take root
challenges.swarm_intelligence=Swarm intelligence
challenges.swarm_intelligence_desc=Watch out, the dungeon monsters are getting smarter!\n\n- When an enemy notices you, nearby enemies are drawn to that location
challenges.darkness=Into darkness
challenges.darkness_desc=It is a dungeon after all!\n\n- Regular visible distance dramatically reduced\n- A torch appears on each floor\n- Other light sources are 1/5 as effective
challenges.no_scrolls=Forbidden runes
challenges.no_scrolls_desc=A certain rune is harder to find. Unfortunately, it's always the most useful one.\n\n- Half of the dungeon's upgrade scrolls are removed
challenges.champion_enemies=Hostile champions
challenges.champion_enemies_desc=You're not the only one who can level up!\n\n- Regular enemies have a 1/8 chance to spawn with a special champion buff\n- Champions wake up if they spawn asleep\n- The hero knows when a champion spawns\n- Champions are immune to corruption\n\nThere are six types of champion enemy:\n_Blazing (orange):_ +25% melee damage, ignites on hit, spreads flames on death, can't ignite water tiles\n_Projecting (purple):_ +25% melee damage, +3 melee range\n_Antimagic (green):_ -50% damage taken, immune to magical effects\n_Giant (blue):_ -80% damage taken, +1 melee range, cannot move into tunnels\n_Blessed (yellow):_ 4x accuracy and evasion\n_Growing (red):_ +20% accuracy, evasion, damage, and effective HP. Increases by 1% every 4 turns.
challenges.stronger_bosses=Stronger bosses
challenges.stronger_bosses_desc=Bosses are much tougher with this challenge!\n\n_Goo:_\n_-_ Healing in water ramps up, to 3/turn\n_-_ Pumps up in 1 turn instead of 2\n_-_ Goolings are stronger\n_Tengu:_\n_-_ Phase 1: traps are much deadlier\n_-_ Phase 2: currently (almost) nothing yet!\n_DM-300:_\n_-_ Pylons are tougher and 3 activate\n_-_ Abilities are more powerful and frequent\n_-_ DM-300 is faster when supercharged\n_-_ Exposed wires are twice as common\n_Dwarf King:_\n_-_ Minions are stronger in all phases\n_-_ Phase 1: faster abilities and summons\n_-_ Phase 2: 2 more minions per round\n_-_ Phase 3: 2x health, faster summons\n_Yog-Dzewa:_\n_-_ Two fists are summoned at a time!\n_-_ +60% laser damage\n_-_ Stronger minions\n\n_All bosses have increased hp!_

challenges.i_hate_myself=I hate myself
challenges.i_hate_myself_desc=Quality of life? Whats that? \n\n_-_ armor, weapons, and rings have a 70% to be cursed (guaranteed non-cursed items unchanged) \n_-_ Scrolls of identify and stones of intuition are banned \n_-_ Potions and scrolls are no longer identified when used\n_-_ The notes system is disabled\n\n_Note:_ I hope you have good memory... or a external notepad
challenges.consuming_greed=Consuming greed
challenges.consuming_greed_desc=You have a inner greed, and it will be satisfied at all costs\n\nStart with the effects of the legacy sin of greed, and it's effects will start on floor 2. The sin will consume your gold every turn, and if you run out of gold, it will instead take your health. The deeper you get, the more gold and health it will consume.


sins.greed=Sin of Greed
sins.greed_desc=Looking to be... richer?\n\n_Earn more gold_ by collecting it at a frequent rate!\n\nBut you earn _less gold_ if you collect it slowly, and the price of items in shops _increases over time_...\n\n\nGreed does not apply to gold with a value less than 3, and will not count as "collecting gold" for its effects.
sins.sloth=Sin of Sloth
sins.sloth_desc=You can progress faster, but you better keep going!\n\nThe experience required to level up _scales slower!_\n\nBut you have _limited turns to complete a floor_. Leftover turns from previous floors do carry over.\n\n_If you run out of turns, you start losing health based on how slow you are._
sins.wrath=Sin of Wrath
sins.wrath_desc=Doesn't it just enrage you how you keep dying over and over?\n\n_Deal 20% more damage_ for all sources!\n\n_But take 30% more damage_ from enemy attacks.
sins.gluttony=Sin of Gluttony
sins.gluttony_desc=Food can be a utilized resource, more so than you thought!\n\nEating food will give a _temporary buff and a small healing effect!_\n\nBut you get _hungry faster and regenerate health slower_.\n\n\n(starving threshold remains unchanged)
sins.envy=Sin of Envy
sins.envy_desc=Less is more, and more is less!\n\nGain _more speed_ and _more strength_ based on how empty your inventory is!\n\nBut when you have too many items, there's a turning point where your _speed and even your evasion is reduced_... You're allowed to carry _1 additional item_ without causing any bad effects based on the current region you are in.\n\n\nInventory bags do not have any effect on this sin (they do not increase thresholds), equipped items count, and stacked items count as one item. Max bonus at 0 items is x1.69 speed and +4 strength.\n\n_(If it takes up a inventory slot, it counts as an item. Yes that includes seeds and runestones too!)_
sins.pride=Sin of Pride
sins.pride_desc=You've got a status to uphold!\n\nDeal increased damage for every successful hit in a row\n\nBut you take increased damage based on the amount of turns passed since you last got hit\n\n\nThe damage bonus is capped at _+30%_, and you can take up to _+200%_ more damage.
sins.desire=Sin of Desire
sins.desire_desc=Wouldn't you just wish to have... more?\n\nItems will always be +1 and have a _higher chance_ to be even more upgraded when generated!\n\nBut all upgradeable items have a 75% to be destroyed when generated...\n\n\nThis sin does not affect shops or quest items. Destroy chance increases by 4% each region.\n\n\nWeakens the effect of Envy if both Desire and Envy are enabled

sins.death=Bringer of Death
sins.death_desc=You too, can cause a lot of death... but will other ethereal beings allow you to?\n\n(W) Start with more _strength_!\n\nBut once every floor, after 30 turns, _death will spawn_ on the floor to hunt you down...\n\n\n\nDeath can _not be killed_, will _always go towards you_, and _gets stronger_ the deeper you get.
sins.yendor=Curse of Yendor
sins.yendor_desc=It is said, that with the power of Yendor... unlimited potential awaits.\n\n(W) The _level cap is increased_ to level 40!\n\nBut mobs have a chance to gain a buff that lasts until they die\n\n\nThe buffs are actual buffs and can only be found by inspecting the enemy.

